name: Update Platle data

on:
  schedule:
    - cron: "0 12 * * *"    # every day at 12:00 UTC: adds 1 new game
  workflow_dispatch:         # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: platle-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install requests beautifulsoup4

      - name: Scrape PlatPursuit
        run: python scraper/scrape.py --start 200 --daily 1 --delay 4

      - name: Save data to the repository
        run: |
          git config user.name "platle-bot"
          git config user.email "platle-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update game data $(date -u +%F)"
            git pull --rebase
            git push
          fi
